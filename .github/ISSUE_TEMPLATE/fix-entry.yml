name: Fix an entry
description: Report a wrong install command, a broken link or outdated information on a skill page.
title: "Fix: "
body:
  - type: input
    id: page
    attributes:
      label: Skill page
      placeholder: https://claude-skills-library-psi.vercel.app/skills/<slug>
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Quote the text or command on the page and say what it should be. A link to the upstream source helps.
    validations:
      required: true
